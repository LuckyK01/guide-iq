name: "🐞 Bug Report"
description: "Report a reproducible issue in the team's solution"
title: "🐞 [BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Do not include credentials or sensitive data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant versions. Remove confidential details.
    validations:
      required: false
